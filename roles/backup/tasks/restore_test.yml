---
# Called by playbooks/restore_test.yml. Live data is never touched.
- name: Back up now, then restore the latest backup and check it (1-5 minutes)
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/restore-test
      --name {{ backup_name | quote }}
      --verify {{ backup_verify_paths | map('quote') | join(' ') }}
      --dump-dir {{ backup_dump_dir | quote }}
      {{ '--backup-first' if backup_restore_test_backup_first | bool else '' }}
  register: backup_restore_raw
  changed_when: false

- name: Read the results
  ansible.builtin.set_fact:
    backup_restore_result: "{{ backup_restore_raw.stdout | from_json }}"

- name: Reports folder on this computer
  ansible.builtin.file:
    path: "{{ backup_report_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Write the restore test report
  ansible.builtin.template:
    src: restore-report.md.j2
    dest: "{{ backup_report_dir }}/{{ inventory_hostname }}-{{ backup_name }}-restore-test.md"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Result
  ansible.builtin.debug:
    msg:
      - "Restore test: {{ 'PASSED' if backup_restore_result.ok else 'FAILED' }}"
      - "Snapshot {{ backup_restore_result.snapshot.id | default('?') }} restored in {{ backup_restore_result.restore.seconds | default('?') }}s"
      - "{{ backup_restore_result.files.compared | default(0) }} files identical, {{ backup_restore_result.databases | default([]) | length }} database(s) checked"
      - "Report: reports/{{ inventory_hostname }}-{{ backup_name }}-restore-test.md"

- name: Fail the play if the restore test failed
  ansible.builtin.assert:
    that: backup_restore_result.ok
    fail_msg: "The restore test FAILED. Read reports/{{ inventory_hostname }}-{{ backup_name }}-restore-test.md"
    quiet: true
