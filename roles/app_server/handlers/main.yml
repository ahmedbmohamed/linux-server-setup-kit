---
- name: Restart mariadb
  ansible.builtin.systemd_service:
    name: mariadb
    state: restarted
  when: app_server_manage_services | bool

- name: Restart app
  ansible.builtin.systemd_service:
    name: "{{ app_server_name }}"
    state: restarted
    daemon_reload: true
  when: app_server_manage_services | bool

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when: app_server_manage_services | bool

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
  when: app_server_manage_services | bool
